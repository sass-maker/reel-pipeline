name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "STATUS.md"
      - "PROJECT_STATUS.md"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "STATUS.md"
      - "PROJECT_STATUS.md"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node scripts/validate-docs.mjs
